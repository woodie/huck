name: macOS package

# Builds a real, unsigned macOS .app on a real (ephemeral, GitHub-hosted)
# macOS machine as a smoke test -- same rationale as windows-package.yml for
# Windows. The actual release .pkg is NOT built here: signing/notarization
# requires jpackage's own --mac-sign to run during packaging (the only way
# it can reach a native library bundled inside a .jar), so on a tag this
# workflow hands the whole build off to zouk instead, which already holds
# the Developer ID certs and notary credentials for this account. See
# docs/COMMENTS.md.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build unsigned .app
        run: ./gradlew createDistributable

  # Only on a version tag, not every push to main or PR -- same reasoning as
  # windows-package.yml's own tag-only release step.
  ask-zouk-to-build-and-sign:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      # Fires a repository_dispatch at zouk instead of building/signing
      # here -- zouk checks out this repo's own source at this tag and runs
      # the real Gradle build itself, with its Developer ID certs and
      # notary credentials already on that runner. SIGNING_BRIDGE_TOKEN is
      # a fine-grained PAT scoped to just this repo and zouk, with
      # Contents: Read and write on both, so it can both trigger this
      # dispatch and (from zouk's side) upload the signed .pkg back onto
      # this same release. See docs/COMMENTS.md.
      - name: Ask zouk to build, sign, and notarize the .pkg
        env:
          GH_TOKEN: ${{ secrets.SIGNING_BRIDGE_TOKEN }}
        run: |
          gh api repos/woodie/zouk/dispatches --input - <<EOF
          {
            "event_type": "sign-huck-pkg",
            "client_payload": {
              "tag": "${{ github.ref_name }}",
              "repo": "${{ github.repository }}"
            }
          }
          EOF
