name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # No sibling checkout of kwick needed anymore -- it's a real Maven
      # Central dependency now (com.netpress:kwick:0.1.2 in
      # build.gradle.kts), not a composite build. See kwick's own
      # docs/COWORK.md for the publish setup this depends on.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Matches build.gradle.kts's jvmToolchain(17) and windows-package.yml's own pin.
          java-version: "17"

      - name: Run tests
        run: ./gradlew clean test
